<div class="kpi-grid">
  <div class="kpi-card"
       ng-repeat="kpi in $ctrl.kpis"
       ng-click="$ctrl.ir(kpi)">
    <div class="kpi-icon" ng-class="'kpi-icon--' + kpi.color">
      <md-icon>{{ kpi.icon }}</md-icon>
    </div>
    <div class="kpi-value">{{ kpi.valor }}</div>
    <div class="kpi-label">{{ kpi.label }}</div>
    <span class="kpi-link">Ver más &rarr;</span>
  </div>
</div>
