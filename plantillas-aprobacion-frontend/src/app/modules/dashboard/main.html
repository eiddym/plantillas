<div class="home-shell-container">
  <!-- Loader -->
  <div class="home-loading" ng-if="main.cargando" layout="column" layout-align="center center">
    <md-progress-circular md-mode="indeterminate" md-diameter="45"></md-progress-circular>
    <p style="margin-top: 15px; color: #64748b; font-weight: 500;">Cargando accesos directos...</p>
  </div>

  <!-- Secciones Dinámicas Derivadas del Menú de Base de Datos -->
  <div class="home-dynamic-sections" ng-if="!main.cargando">

    <div class="section" ng-repeat="seccion in main.secciones">
      <div class="section-panel">
        <div class="section-header">
          <span class="dot" ng-class="'bg-' + seccion.color">
            <md-icon style="font-size: 16px; width: 16px; height: 16px; color: #ffffff;">{{ seccion.icon }}</md-icon>
          </span>
          <h2>{{ seccion.label }}</h2>
        </div>

        <div class="grid">
          <div class="card" ng-repeat="item in seccion.items" ng-click="main.irARuta(item.url)">
            <div class="card-top">
              <span class="icon-badge" ng-class="'bg-' + item.color">
                <md-icon style="font-size: 18px; width: 18px; height: 18px; color: #ffffff;">{{ item.icon }}</md-icon>
              </span>
              <span class="count">{{ item.valor || 0 }}</span>
            </div>
            <div>
              <p class="card-title">{{ item.label }}</p>
              <p class="card-sub">{{ item.desc }}</p>
            </div>
            <div class="card-link">Ir a {{ item.label }} &rarr;</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer de Inicio -->
  <div class="home-shell-footer">
    <span>COOPERATIVA MINERA MARABUNTA R.L. &middot; Sistema de Plantillas 2026</span>
  </div>
</div>
