<style>
/* 1. FONDO Y CONTENEDOR PRINCIPAL */
.container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: url('assets/images/background.png') no-repeat center center fixed;
    background-size: cover;
    font-family: 'Roboto', sans-serif;
}

/* 2. TARJETA HORIZONTAL (2 COLUMNAS) */
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

.login-card-horizontal {
    display: flex;
    width: 100%;
    max-width: 950px; /* Ancho de la tarjeta para las 2 columnas */
    min-height: 500px;
    background-color: #ffffff;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    overflow: hidden; /* Para que los bordes redondeados corten el contenido */
    animation: fadeIn 0.5s ease-out;
}

/* --- PANEL IZQUIERDO (LOGO Y FONDO) --- */
.panel-izquierdo {
    flex: 1; /* Ocupa la mitad del espacio */
    background: #f8f9fa; /* Color de respaldo */
    /* Aquí puedes poner la imagen de fondo gris del edificio que tienes en tu diseño */
    background: url('assets/images/fondo-edificio.png') no-repeat center center;
    background-size: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    position: relative;
    border-right: 1px solid #eeeeee;
}

.logo-cooperativa {
    width: 100%;
    max-width: 320px;
    height: auto;
    filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.2));
    z-index: 2;
}

/* --- PANEL DERECHO (FORMULARIO) --- */
.panel-derecho {
    flex: 1; /* Ocupa la otra mitad */
    padding: 50px 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background-color: #ffffff;
}

/* TEXTOS DE CABECERA */
.cabecera-sistema {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #000000;
    text-transform: uppercase;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
}

.titulo-docs {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    color: #000000;
    margin-bottom: 40px;
    letter-spacing: 1px;
}

/* 4. INPUTS ADAPTADOS AL NUEVO MOCKUP */
.md-input-container {
    margin: 10px 0 25px 0 !important;
    position: relative;
    width: 100%;
}

.md-input-container label {
    display: none !important; /* Ocultamos los labels flotantes si queremos que sea igual a tu imagen */
}

/* Inputs tipo caja rectangular blanca con borde negro */
.input-blanco {
    width: 100%;
    height: 50px;
    background-color: #ffffff !important;
    border: 1px solid #000000 !important; /* Borde negro como en tu imagen */
    border-radius: 0px !important; /* Cuadrados, sin bordes redondeados */
    padding: 0 45px !important;
    font-size: 15px;
    color: #000000 !important;
    box-sizing: border-box;
    transition: all 0.3s ease;
}

.input-blanco:focus {
    outline: none;
    box-shadow: inset 0 0 0 1px #000000 !important; /* Efecto al hacer clic */
}

.icon-field {
    position: absolute;
    left: 12px;
    top: 38px; /* Ajuste manual del icono */
    color: #000000;
    font-size: 24px;
    z-index: 2;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 38px;
    background: transparent;
    border: none;
    color: #3f51b5; /* Opcional: Ojito de un color sutil o negro */
    cursor: pointer;
    z-index: 2;
    padding: 0;
}

/* 5. BOTÓN LOGIN AZUL OSCURO */
.login-btn {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background-color: #1e293b !important; /* Color azul muy oscuro */
    color: white !important;
    border: none;
    border-radius: 25px !important; /* Bordes redondeados del botón */
    font-weight: 700;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.login-btn:hover:not(:disabled) {
    background-color: #0f172a !important; /* Más oscuro al pasar el ratón */
    transform: translateY(-2px);
    box-shadow: 0 8px 15px rgba(30, 41, 59, 0.4);
}

.login-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* 6. LINK VERIFICAR DOCUMENTOS */
.verificar-enlace {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 25px;
    cursor: pointer;
    color: #4b7bec; /* Azul claro estilo link */
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    transition: color 0.3s ease;
}

.verificar-enlace:hover {
    color: #3867d6;
    text-decoration: underline;
}

.icono-mano {
    font-size: 22px;
    margin-left: 8px;
}

/* RESPONSIVE: En móviles se apila una debajo de la otra */
@media (max-width: 768px) {
    .login-card-horizontal {
        flex-direction: column;
        max-width: 450px;
    }
    .panel-izquierdo {
        padding: 40px 20px;
        border-right: none;
        border-bottom: 1px solid #eeeeee;
    }
    .panel-derecho {
        padding: 40px 30px;
    }
    .logo-cooperativa {
        max-width: 220px;
    }
}
</style>

<div class="container">
    <div class="login-card-horizontal">

        <div class="panel-izquierdo">
            <img src="assets/images/logo.png" alt="Logo Cooperativa" class="logo-cooperativa">
        </div>

        <div class="panel-derecho">
            
            <div class="cabecera-sistema">Sistema de documentos digitales de la cooperativa minera Marabunta R.L.</div>
            <div class="titulo-docs">DOCS</div>

            <form name="loginForm" ng-submit="login.login()" layout="column">

                <md-input-container class="md-block" style="margin-top: 0;">
                    <md-icon class="material-icons icon-field">person</md-icon>
                    <input name="username"
                           ng-model="login.username"
                           class="input-blanco"
                           placeholder="Nombre de usuario"
                           required>
                </md-input-container>

                <md-input-container class="md-block">
                    <md-icon class="material-icons icon-field">lock</md-icon>
                    <input name="password"
                           type="{{login.showPassword ? 'text' : 'password'}}"
                           ng-model="login.password"
                           class="input-blanco"
                           placeholder="Contraseña"
                           required>
                    <button type="button" class="toggle-password" ng-click="login.showPassword = !login.showPassword">
                        <md-icon class="material-icons">{{login.showPassword ? 'visibility_off' : 'visibility'}}</md-icon>
                    </button>
                </md-input-container>

                <button type="submit" class="login-btn" ng-disabled="loginForm.$invalid">
                    INICIAR SESIÓN
                </button>

            </form>

            <div class="verificar-enlace" ng-click="login.irAVerificar()">
                <span>Verifica tu documento aquí</span>
                <span class="icono-mano">👆🏽</span>
                <md-tooltip md-direction="top">Ir a verificación</md-tooltip>
            </div>

            <div style="text-align: center; margin-top: 30px; font-size: 10px; color: #777;">
   
            </div>

        </div>
    </div>
</div>
