services:

  # ============================================================
  # 0. Detector de IP / URL QR LAN
  # Ejecuta una vez. Es fallback cuando URL_VERIFICACION está vacía.
  # Para VPS con Traefik, usar URL_VERIFICACION HTTPS en .env.
  # ============================================================
  detector-ip:
    image: alpine:3.20
    network_mode: host
    volumes:
      - ./detectar-ip-host.sh:/detectar-ip-host.sh:ro
      - shared-config:/shared
    command: >
      sh -c "apk add --no-cache iproute2 >/dev/null 2>&1;
      sh /detectar-ip-host.sh"
    restart: "no"

  # ============================================================
  # 1. PostgreSQL 13
  # Sin puerto publicado: solo accesible para backend por Docker.
  # ============================================================
  db:
    image: postgres:13-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - red-plantillas

  # ============================================================
  # 2. Backend Node.js
  # Espera PostgreSQL, toma URL QR automática si es necesaria,
  # aplica parches idempotentes e inicia API.
  # ============================================================
  backend:
    build:
      context: ./plantillas-aprobacion-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "until node -e \"require('net').connect(5432, 'db')
      .on('connect', () => process.exit(0))
      .on('error', () => process.exit(1))\"; do
      echo 'Esperando a PostgreSQL...';
      sleep 2;
      done;
      if [ -f /shared/url_verificacion.env ] &&
      [ -z \"$$URL_VERIFICACION\" ]; then
      export $$(cat /shared/url_verificacion.env | xargs);
      echo '[backend] URL_VERIFICACION obtenida del detector';
      fi;
      npm run parchar &&
      node index.js"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db
      DB_PUERTO: 5432
      DB_USUARIO: ${DB_USUARIO}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NOMBRE: ${DB_NOMBRE}
      BACKEND_PUERTO: ${BACKEND_PUERTO:-8000}
      JWT_SECRET: ${JWT_SECRET}
      OPENSSL_CONF: ${OPENSSL_CONF:-/dev/null}
      CORREO_HOST: ${CORREO_HOST}
      CORREO_PUERTO: ${CORREO_PUERTO:-587}
      CORREO_REMITENTE: ${CORREO_REMITENTE}
      CORREO_ORIGEN: ${CORREO_ORIGEN}
      CORREO_USUARIO: ${CORREO_USUARIO}
      CORREO_PASSWORD: ${CORREO_PASSWORD}
      CORREO_SECURE: ${CORREO_SECURE:-false}
      CORREO_IGNORETLS: ${CORREO_IGNORETLS:-false}
      CORREO_TLS_RECHAZAR: ${CORREO_TLS_RECHAZAR:-true}
      RUNTIME_CONFIG_PATH: /app/runtime-config/plantillas.json
      INSTALLATION_FLAG_PATH: /app/runtime-config/installed.flag
    depends_on:
      db:
        condition: service_healthy
      detector-ip:
        condition: service_completed_successfully
    volumes:
      - plantillas-documentos:/app/public
      - shared-config:/shared:ro
      - plantillas-runtime-config:/app/runtime-config
    networks:
      - red-plantillas

  # ============================================================
  # 3. Frontend Nginx :80 interno
  # Público exclusivamente mediante Traefik.
  # ============================================================
  frontend:
    build:
      context: ./plantillas-aprobacion-frontend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    expose:
      - "80"
    networks:
      - red-plantillas
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik-public"

      traefik.http.routers.docs-marabunta.rule: "Host(`${TRAEFIK_HOST}`)"
      traefik.http.routers.docs-marabunta.entrypoints: "websecure"
      traefik.http.routers.docs-marabunta.tls: "true"
      traefik.http.routers.docs-marabunta.tls.certresolver: "letsencrypt"
      traefik.http.services.docs-marabunta.loadbalancer.server.port: "80"

      traefik.http.routers.docs-marabunta-http.rule: "Host(`${TRAEFIK_HOST}`)"
      traefik.http.routers.docs-marabunta-http.entrypoints: "web"
      traefik.http.routers.docs-marabunta-http.middlewares: "docs-marabunta-https"
      traefik.http.middlewares.docs-marabunta-https.redirectscheme.scheme: "https"

      # Alternativa para Nginx o Apache ejecutado directamente en el host:
      # 1. Eliminar red traefik-public y labels traefik.*.
      # 2. Descomentar el bloque ports:
      #
      # ports:
      #   - "127.0.0.1:${FRONTEND_PUERTO:-8080}:80"

networks:
  red-plantillas:
    driver: bridge

  traefik-public:
    external: true
    name: traefik-public

volumes:
  pgdata:
  plantillas-documentos:
  shared-config:
  plantillas-runtime-config: