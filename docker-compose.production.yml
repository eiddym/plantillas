name: plantillas

services:
  db:
    image: postgres:13-alpine
    container_name: plantillas-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NOMBRE}
      POSTGRES_USER: ${DB_USUARIO}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - plantillas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USUARIO} -d ${DB_NOMBRE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plantillas_network

  backend:
    build:
      context: ./plantillas-aprobacion-backend
      dockerfile: Dockerfile
    container_name: plantillas-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - plantillas_documentos:/app/public/documentos
      - plantillas_externos:/app/public/externos
      - plantillas_aprobacion:/app/public/aprobacion
    networks:
      - plantillas_network

  frontend:
    build:
      context: ./plantillas-aprobacion-frontend
      dockerfile: docker/Dockerfile
    container_name: plantillas-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - plantillas_network

networks:
  plantillas_network:
    name: plantillas_network
    driver: bridge

volumes:
  plantillas_postgres_data:
    name: plantillas_postgres_data
  plantillas_documentos:
    name: plantillas_documentos
  plantillas_externos:
    name: plantillas_externos
  plantillas_aprobacion:
    name: plantillas_aprobacion
