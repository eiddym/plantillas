services:
  detector-ip:
    image: alpine:3.20
    network_mode: host
    volumes:
      - ./detectar-ip-host.sh:/detectar-ip-host.sh:ro
      - shared-config:/shared
    command: >
      sh -c "apk add --no-cache iproute2 >/dev/null 2>&1;
      sh /detectar-ip-host.sh"
    restart: "no"

  db:
    image: postgres:13-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - red-plantillas

  backend:
    build:
      context: ./plantillas-aprobacion-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "until node -e \"require('net').connect(5432, 'db')
      .on('connect', () => process.exit(0))
      .on('error', () => process.exit(1))\"; do
      echo 'Esperando a PostgreSQL...';
      sleep 2;
      done;
      if [ -f /shared/url_verificacion.env ] &&
      [ -z \"$$URL_VERIFICACION\" ]; then
      export $$(cat /shared/url_verificacion.env | xargs);
      echo '[backend] URL_VERIFICACION configurada automáticamente';
      fi;
      npm install &&
      npm run parchar &&
      node index.js"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db
      DB_PUERTO: 5432
      DB_USUARIO: ${DB_USUARIO}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NOMBRE: ${DB_NOMBRE}
      BACKEND_PUERTO: ${BACKEND_PUERTO:-8000}
      JWT_SECRET: ${JWT_SECRET}
      OPENSSL_CONF: ${OPENSSL_CONF:-/dev/null}
      CORREO_HOST: ${CORREO_HOST}
      CORREO_PUERTO: ${CORREO_PUERTO:-587}
      CORREO_REMITENTE: ${CORREO_REMITENTE}
      CORREO_ORIGEN: ${CORREO_ORIGEN}
      CORREO_USUARIO: ${CORREO_USUARIO}
      CORREO_PASSWORD: ${CORREO_PASSWORD}
      CORREO_SECURE: ${CORREO_SECURE:-false}
      CORREO_IGNORETLS: ${CORREO_IGNORETLS:-false}
      CORREO_TLS_RECHAZAR: ${CORREO_TLS_RECHAZAR:-true}
    depends_on:
      db:
        condition: service_healthy
      detector-ip:
        condition: service_completed_successfully
    volumes:
      - plantillas-documentos:/app/public
      - shared-config:/shared:ro
    networks:
      - red-plantillas

  frontend:
    build:
      context: ./plantillas-aprobacion-frontend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PUERTO:-80}:80"
    networks:
      - red-plantillas

networks:
  red-plantillas:
    driver: bridge

volumes:
  pgdata:
  plantillas-documentos:
  shared-config:
